<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة عروض الشراكة | لوحة التحكم</title>
    <link rel="stylesheet" href="/css/admin-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
    <!-- نستخدم نفس الهيدر الخاص بالآدمن -->
    <nav class="top-nav">
        <div class="nav-container">
            <div class="nav-right">
                <div class="logo"><i class="fas fa-handshake"></i> <span>مستثمر - إدارة الشراكات</span></div>
            </div>
            <div class="nav-links">
                <a href="admin-approval.html" class="nav-link">مصادقة المشاريع</a>
                <a href="admin-proposals.html" class="nav-link active">عروض الشراكة</a>
                <a href="/admin-featured.html" class="nav-link ">المشاريع المميزة</a>

                <a href="index.html" class="nav-link">الموقع الرئيسي</a>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <!-- استبدل قسم الـ header في admin-proposals.html بهذا -->
            <header class="page-header">
                <div class="header-top">

                    <h1 class="page-title"><i class="fas fa-file-signature"></i> كافة عروض الشراكة والمقترحات</h1>
                    <p class="text-gray-500">مراقبة التفاعل بين المستثمرين وأصحاب المشاريع وضمان جودة العروض.</p>
                </div>

                <!-- شريط الأدوات: بحث + فلاتر -->
                <div class="filters-section">
                    <div class="filters">
                        <!-- البحث بالكتابة -->
                        <div class="search-group">
                            <label>البحث:</label>
                            <div style="position: relative;">
                                <input type="text" class="search-input" id="searchInput"
                                    placeholder="اسم المستثمر أو المشروع...">
                                <i class="fas fa-search search-icon"></i>
                            </div>
                        </div>

                        <!-- فلتر الحالة -->
                        <div class="filter-group">
                            <label>حالة العرض:</label>
                            <select class="filter-select" id="statusFilter">
                                <option value="all">كل الحالات</option>
                                <option value="pending">قيد الانتظار</option>
                                <option value="accepted">تم القبول</option>
                                <option value="rejected">تم الرفض</option>
                            </select>
                        </div>

                        <!-- فلتر الترتيب -->
                        <div class="filter-group">
                            <label>الترتيب الزمني:</label>
                            <select class="filter-select" id="sortFilter">
                                <option value="newest">الأحدث أولاً</option>
                                <option value="oldest">الأقدم أولاً</option>
                            </select>
                        </div>
                    </div>
                </div>
            </header>

            <!-- شبكة العروض -->
            <section class="proposals-grid" id="adminProposalsGrid">
                <div class="text-center py-10"><i class="fas fa-spinner fa-spin"></i> جاري التحميل...</div>
            </section>
        </div>
    </main>

    <!-- مودال التفاصيل الكاملة -->
    <div class="modal" id="proposalDetailModal">
        <div class="modal-content large">
            <div class="modal-header">
                <h2 id="modalTitle">تفاصيل العرض</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- المحتوى سيُحقن هنا عبر JS -->
            </div>
        </div>
    </div>

    <script src="/js/script.js"></script>
    <script src="/js/admin-proposals.js"></script>
</body>

</html>
