<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="my-projects-page-title">مشاريعي - منصة مستثمر</title>
    <link rel="stylesheet" href="/css/styles-my-projects.css">
    <link rel="stylesheet" href="/css/header-styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body data-page-key="page-title-my-projects">
    <div class="app rtl" id="app">
        <!-- Header -->
        <div id="header-placeholder" class="header-placeholder"></div>


        <!-- 2. المحتوى الرئيسي الجديد -->
        <main class="main-content">
            <div class="container">
                <!-- رأس الصفحة -->
                <header class="page-header">
                    <div class="header-top">
                        <h1 class="page-title" data-i18n-key="my-projects-title">مشاريعي</h1>
                        <!-- === التعديل: تحويل الزر إلى رابط === -->
                        <a href="/add-project-new.html" class="add-project-btn">
                            <i class="fas fa-plus"></i>
                            <span data-i18n-key="my-projects-add-new-btn">
                                إضافة مشروع جديد
                            </span>
                        </a>
                        <!-- =================================== -->
                    </div>

                    <!-- شريط التصفية والبحث -->
                    <div class="filters-section">
                        <div class="filters">
                            <div class="filter-group">
                                <label data-i18n-key="my-projects-filter-label">تصفية حسب الحالة:</label>
                                <select class="filter-select" id="statusFilter">
                                    <option value="" data-i18n-key="my-projects-status-all">جميع الحالات</option>
                                    <option value="draft" data-i18n-key="my-projects-status-draft">مسودة</option>
                                    <option value="published" data-i18n-key="my-projects-status-published">منشور
                                    </option>
                                    <option value="funded" data-i18n-key="my-projects-status-funded">مكتمل التمويل
                                    </option>
                                    <option value="under-review" data-i18n-key="my-projects-status-review">قيد المراجعة
                                    </option>
                                    <option value="closed" data-i18n-key="my-projects-status-closed">مغلق</option>
                                </select>
                            </div>
                            <div class="filter-group">
                                <label data-i18n-key="my-projects-sort-label">ترتيب حسب:</label>
                                <select class="filter-select" id="sortFilter">
                                    <option value="newest" data-i18n-key="my-projects-sort-newest">الأحدث</option>
                                    <option value="oldest" data-i18n-key="my-projects-sort-oldest">الأقدم</option>
                                </select>
                            </div>
                            <div class="search-group">
                                <input type="text" class="search-input" placeholder="البحث في المشاريع..."
                                    id="searchInput" data-i18n-key="my-projects-search-placeholder">
                                <i class="fas fa-search search-icon"></i>
                            </div>
                        </div>
                    </div>
                </header>

                <!-- منطقة عرض المشاريع -->
                <section class="projects-grid" id="projectsGrid">
                    <!-- بطاقات المشاريع ستُضاف هنا بواسطة JavaScript -->
                </section>
            </div>
        </main>
    </div>

    <!-- مودال طلب التعديل -->
    <div id="revisionModal" class="modal-overlay" style="display: none;">
        <div class="modal-box" style="max-width: 550px;">
            <div class="modal-header">
                <h3 class="modal-title" data-i18n-key="revision-modal-title">طلب تعديل على المشروع</h3>
                <span class="modal-close" onclick="closeRevisionModal()">&times;</span>
            </div>

            <div class="modal-body">
                <!-- رسالة توضيحية -->
                <div class="info-alert"
                    style="background: #eff6ff; border-right: 4px solid #3b82f6; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                    <p style="font-size: 0.9rem; color: #1e40af; line-height: 1.6;"
                        data-i18n-key="revision-importance-msg">
                        <i class="fas fa-info-circle"></i>
                        تساعدنا مراجعة التعديلات على ضمان دقة البيانات المعروضة للمستثمرين. يرجى تحديد الأقسام بدقة
                        لتسريع عملية الموافقة.
                    </p>
                </div>

                <form id="revisionForm">
                    <input type="hidden" id="revisionProjectId">
                    <input type="hidden" id="revisionProjectName">

                    <!-- اختيار الأقسام (Checkboxes بأسلوب أنيق) -->
                    <div class="form-group">
                        <label style="font-weight: bold; margin-bottom: 10px; display: block;"
                            data-i18n-key="revision-select-sections">ما هي الأقسام التي تود تعديلها؟</label>
                        <div class="sections-selection-grid"
                            style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
                            <label class="check-item"><input type="checkbox" value="المعلومات الأساسية"><span
                                    data-i18n-key="revision-section-basic">معلومات المشروع</span></label>
                            <label class="check-item"><input type="checkbox" value="الخطة المالية"><span
                                    data-i18n-key="revision-section-financial">البيانات المالية</span></label>
                            <label class="check-item"><input type="checkbox" value="الصور والمرفقات"><span
                                    data-i18n-key="revision-section-media">الصور والملفات</span></label>
                                <!-- <label class="check-item"><input type="checkbox" value="فريق العمل"> الفريق المؤسس</label> -->
                                <label class="check-item"><input type="checkbox" value="مرحلة المشروع"><span
                                        data-i18n-key="revision-section-stage">مرحلة التنفيذ</span>
                                </label>
                                <label class="check-item"><input type="checkbox" value="أخرى"> <span
                                        data-i18n-key="revision-section-other">أخرى</span>
                                </label>
                        </div>
                    </div>

                    <!-- شرح التعديل -->
                    <div class="form-group" style="margin-top: 20px;">
                        <label style="font-weight: bold; margin-bottom: 10px; display: block;"
                            data-i18n-key="revision-details-label">وضح أسباب التعديل والتغييرات المطلوبة:</label>
                        <textarea id="revisionDetails" class="form-control" rows="5"
                            placeholder="مثلاً: أريد تحديث نسبة الأرباح المتوقعة للسنة الثانية..." required
                            style="width: 100%; border-radius: 8px; padding: 12px;"></textarea>
                    </div>

                    <div class="modal-footer"
                        style="margin-top: 25px; display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" class="action-btn btn-secondary" onclick="closeRevisionModal()"
                            data-i18n-key="profile-contact-cancel-btn">إلغاء</button>
                        <button type="submit" class="action-btn btn-primary" id="btnSendRevision"
                            data-i18n-key="revision-submit-btn">إرسال الطلب</button>
                    </div>
                </form>
            </div>
        </div>
    </div>


    <script src="/js/header.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/translation.js"></script>
    <script src="/js/my-projects.js"></script>


</body>

</html>
