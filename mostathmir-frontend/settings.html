<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="settings-page-title">إعدادات الحساب - منصة مستثمر</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/css/header-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
        rel="stylesheet">
    <style>
        /* تنسيقات سريعة للشريط الجانبي لضمان عمله فوراً */
        .settings-layout {
            display: flex;
            gap: 30px;
            margin-top: 2rem;
        }

        .settings-sidebar {
            flex: 0 0 250px;
        }

        .settings-nav {
            background: white;
            border-radius: 12px;
            padding: 10px;
            border: 1px solid #e2e8f0;
            position: sticky;
            top: 100px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 12px 15px;
            border: none;
            background: none;
            color: #64748b;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: right;
            margin-bottom: 5px;
        }

        .nav-item:hover {
            background: #f8fafc;
            color: #1e3a8a;
        }

        .nav-item.active {
            background: #eff6ff;
            color: #1e3a8a;
            border-right: 4px solid #1e3a8a;
        }

        .nav-item.danger {
            color: #ef4444;
        }

        .settings-tab-content {
            display: none;
        }

        .settings-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .settings-content-area {
            flex: 1;
        }

        .flex-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 1rem;
        }

        @media (max-width: 992px) {
            .settings-layout {
                flex-direction: column;
            }

            .settings-sidebar {
                flex: none;
                width: 100%;
            }

            .settings-nav {
                display: flex;
                overflow-x: auto;
                white-space: nowrap;
                position: static;
            }

            .nav-item {
                width: auto;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body data-page-key="page-title-settings">
    <div class="app rtl" id="app">
        <div id="header-placeholder"></div>

        <section class="settings-section">
            <div class="container">
                <h1 class="section-title" data-i18n-key="settings-title">إعدادات الحساب</h1>

                <div class="settings-layout">
                    <!-- الشريط الجانبي للتنقل -->
                    <aside class="settings-sidebar">
                        <nav class="settings-nav">
                            <button type="button" class="nav-item active" data-target="section-account">
                                <i class="fas fa-user-cog"></i> <span data-i18n-key="settings-account-info">معلومات
                                    الحساب</span>
                            </button>
                            <button type="button" class="nav-item" data-target="section-skills">
                                <i class="fas fa-star"></i> <span data-i18n-key="settings-skills-title">المهارات</span>
                            </button>
                            <button type="button" class="nav-item" data-target="section-experience">
                                <i class="fas fa-briefcase"></i> <span data-i18n-key="settings-experience-title">الخبرة
                                    المهنية</span>
                            </button>
                            <button type="button" class="nav-item" data-target="section-education">
                                <i class="fas fa-graduation-cap"></i> <span
                                    data-i18n-key="settings-education-title">التعليم</span>
                            </button>
                            <button type="button" class="nav-item" data-target="section-social">
                                <i class="fas fa-share-alt"></i> <span data-i18n-key="settings-social-links">الروابط
                                    الاجتماعية</span>
                            </button>
                            <button type="button" class="nav-item" data-target="section-privacy">
                                <i class="fas fa-user-shield"></i> <span
                                    data-i18n-key="settings-preferences">الخصوصية</span>
                            </button>
                            <button type="button" class="nav-item danger" data-target="section-danger">
                                <i class="fas fa-trash-alt"></i> <span data-i18n-key="settings-delete-account">إدارة
                                    الحساب</span>
                            </button>
                        </nav>
                    </aside>

                    <!-- منطقة المحتوى -->
                    <div class="settings-content-area">
                        <form id="settingsForm" class="settings-form">

                            <!-- 1. قسم معلومات الحساب -->
                            <div id="section-account" class="settings-tab-content active">
                                <div class="settings-card">
                                    <div class="flex-header">
                                        <h2 class="settings-card-title" data-i18n-key="settings-account-info"
                                            style="border:none; margin:0; padding:0;">معلومات الحساب</h2>
                                        <div class="settings-actions">
                                            <button type="button" class="btn btn-outline" id="editBtnGlobal"
                                                data-i18n-key="settings-account-info-edit">تعديل</button>
                                        </div>
                                    </div>

                                    <div class="form-group">
                                        <label for="email" class="form-label" data-i18n-key="settings-email">البريد
                                            الإلكتروني</label>
                                        <input type="email" id="email" class="form-control" value="" disabled>
                                    </div>
                                    <div class="form-group">
                                        <label for="fullName" class="form-label" data-i18n-key="signup-fullname">الاسم
                                            الكامل</label>
                                        <input type="text" id="fullName" class="form-control" value="" required
                                            disabled>
                                    </div>
                                    <div class="form-group">
                                        <label for="profileTitle" class="form-label"
                                            data-i18n-key="settings-profile-title-label">العنوان الوظيفي</label>
                                        <input type="text" id="profileTitle" class="form-control"
                                            placeholder="مثال: مطور تطبيقات" disabled>
                                    </div>
                                    <div class="form-group">
                                        <label for="phone" class="form-label" data-i18n-key="signup-phone">رقم
                                            الهاتف</label>
                                        <div class="phone-input-wrapper"
                                            style="position: relative; display: flex; gap: 10px;">
                                            <input type="tel" id="phone" class="form-control" value="" disabled
                                                style="flex: 1;">
                                            <span id="phoneVerifiedBadge"
                                                style="display: none; align-items: center; color: #10b981;"><i
                                                    class="fas fa-check-circle fa-lg"></i></span>
                                            <button type="button" id="btnStartVerify" class="btn btn-outline"
                                                style="display: none; white-space: nowrap; font-size: 0.8rem;">تأكيد
                                                الرقم</button>
                                        </div>
                                        <div id="otpSection"
                                            style="display: none; margin-top: 15px; padding: 15px; background: #f0f7ff; border-radius: 8px; border: 1px solid #cce3ff;">
                                            <p id="otpSentMessage" class="text-sm text-blue-800 mb-3"></p>
                                            <div style="display: flex; gap: 8px;">
                                                <input type="text" id="otpInput" class="form-control" placeholder="0000"
                                                    maxlength="4"
                                                    style="text-align: center; letter-spacing: 5px; font-weight: bold;">
                                                <button type="button" id="btnConfirmOTP"
                                                    class="btn btn-primary">تأكيد</button>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="location" class="form-label"
                                            data-i18n-key="signup-location">الموقع</label>
                                        <div class="grid grid-cols-2 gap-4">
                                            <select id="country" name="country" class="form-select" disabled required>
                                                <option value="">اختر الدولة</option>
                                            </select>
                                            <select id="city" name="city" class="form-select" disabled required>
                                                <option value="">اختر المدينة</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="bio" class="form-label" data-i18n-key="signup-bio">نبذة عنك</label>
                                        <textarea id="bio" class="form-control" rows="3" disabled></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. قسم المهارات -->
                            <div id="section-skills" class="settings-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-skills-title">المهارات</h2>
                                    <div id="skillsFormContainer"></div>
                                    <button type="button" id="addSkillBtn" class="btn btn-outline-dashed" disabled>+
                                        إضافة مهارة</button>
                                </div>
                            </div>

                            <!-- 3. قسم الخبرة -->
                            <div id="section-experience" class="settings-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-experience-title">الخبرة
                                        المهنية</h2>
                                    <div id="experienceFormContainer"></div>
                                    <button type="button" id="addExperienceBtn" class="btn btn-outline-dashed"
                                        disabled>+ إضافة خبرة مهنية</button>
                                </div>
                            </div>

                            <!-- 4. قسم التعليم -->
                            <div id="section-education" class="settings-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-education-title">التعليم
                                        والمؤهلات</h2>
                                    <div id="educationFormContainer"></div>
                                    <button type="button" id="addEducationBtn" class="btn btn-outline-dashed" disabled>+
                                        إضافة مؤهل تعليمي</button>
                                </div>
                            </div>

                            <!-- 5. قسم الروابط الاجتماعية -->
                            <div id="section-social" class="settings-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-social-links">روابط التواصل
                                    </h2>
                                    <div id="socialLinksContainer"></div>
                                    <button type="button" id="addSocialLinkBtn" class="btn btn-outline-dashed"
                                        disabled>+ إضافة رابط</button>
                                </div>
                            </div>

                            <!-- 6. قسم الخصوصية -->
                            <div id="section-privacy" class="settings-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-preferences">الخصوصية
                                        والتفضيلات</h2>
                                    <div class="form-group">
                                        <label class="form-label" data-i18n-key="settings-interests">مجالات
                                            الاهتمام</label>
                                        <div class="interests-container" id="interestsContainer"></div>
                                    </div>
                                    <div class="form-group-inline">
                                        <label data-i18n-key="settings-show-email">إظهار البريد للعموم</label>
                                        <label class="switch-toggle"><input type="checkbox" id="showEmailPublicly"
                                                disabled><span class="slider"></span></label>
                                    </div>
                                    <div class="form-group-inline">
                                        <label data-i18n-key="settings-show-phone">إظهار الهاتف للعموم</label>
                                        <label class="switch-toggle"><input type="checkbox" id="showPhonePublicly"
                                                disabled><span class="slider"></span></label>
                                    </div>
                                </div>
                            </div>

                            <!-- 7. إدارة الحساب -->
                            <div id="section-danger" class="settings-tab-content">
                                <div class="settings-card danger-zone">
                                    <h2 class="settings-card-title" data-i18n-key="settings-delete-account">حذف الحساب
                                    </h2>
                                    <p>بمجرد حذف حسابك، سيتم مسح جميع بياناتك ومشاريعك بشكل دائم.</p>
                                    <button type="button" id="deleteAccountBtn" class="btn btn-danger">حذف حسابي
                                        نهائياً</button>
                                </div>
                            </div>

                            <!-- أزرار الحفظ السفلية -->
                            <div class="settings-actions" style="margin-top: 2rem;">
                                <button type="submit" class="btn btn-primary" id="saveAllBtn"
                                    data-i18n-key="settings-save-changes">حفظ كافة التغييرات</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <footer class="footer"></footer>
    </div>

    <!-- Templates -->
    <template id="skillTemplate">
        <div class="dynamic-form-row skill-row">
            <input type="text" class="form-control skill-name" placeholder="اسم المهارة">
            <div class="skill-level-container"><input type="range" class="skill-level" min="0" max="100"><span
                    class="skill-level-value">80%</span></div>
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="experienceTemplate">
        <div class="dynamic-form-row">
            <input type="text" class="form-control exp-title" placeholder="المنصب">
            <input type="text" class="form-control exp-company" placeholder="الشركة">
            <input type="text" class="form-control exp-period" placeholder="الفترة">
            <textarea class="form-control exp-description" placeholder="الوصف" rows="2"></textarea>
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="educationTemplate">
        <div class="dynamic-form-row">
            <input type="text" class="form-control edu-degree" placeholder="الشهادة">
            <input type="text" class="form-control edu-institution" placeholder="المؤسسة">
            <input type="text" class="form-control edu-details" placeholder="التفاصيل">
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="socialLinkTemplate">
        <div class="social-link-row">
            <select class="form-select social-platform">
                <option value="website">Website</option>
                <option value="linkedin">LinkedIn</option>
                <option value="github">GitHub</option>
                <option value="twitter">Twitter</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
            </select>
            <input type="text" class="form-control social-url" placeholder="الرابط">
            <button type="button" class="btn-icon remove-link-btn">&times;</button>
        </div>
    </template>

    <script src="/js/header.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/translation.js"></script>
    <script src="/js/settings.js"></script>
</body>

</html>
