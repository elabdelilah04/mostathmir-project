<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="settings-page-title">إعدادات الحساب - منصة مستثمر</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="/css/header-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
        rel="stylesheet">


</head>

<body data-page-key="page-title-settings">

    <div class="app rtl" id="app">
        <div id="header-placeholder" class="header-placeholder"></div>

        <section class="settings-section">
            <div class="container">
                <h1 class="section-title" data-i18n-key="settings-title">إعدادات الحساب</h1>

                <div class="st-layout">
                    <!-- الشريط الجانبي -->
                    <aside class="st-sidebar">
                        <nav class="st-nav">
                            <button type="button" class="st-nav-link active" data-target="section-account">
                                <i class="fas fa-user-cog"></i> <span data-i18n-key="settings-account-info">معلومات
                                    الحساب</span>
                            </button>
                            <button type="button" class="st-nav-link" data-target="section-skills">
                                <i class="fas fa-star"></i> <span data-i18n-key="settings-skills-title">المهارات</span>
                            </button>
                            <button type="button" class="st-nav-link" data-target="section-experience">
                                <i class="fas fa-briefcase"></i> <span data-i18n-key="settings-experience-title">الخبرة
                                    المهنية</span>
                            </button>
                            <button type="button" class="st-nav-link" data-target="section-education">
                                <i class="fas fa-graduation-cap"></i> <span
                                    data-i18n-key="settings-education-title">التعليم</span>
                            </button>
                            <button type="button" class="st-nav-link" data-target="section-social">
                                <i class="fas fa-share-alt"></i> <span data-i18n-key="settings-social-links">الروابط
                                    الاجتماعية</span>
                            </button>
                            <button type="button" class="st-nav-link" data-target="section-privacy">
                                <i class="fas fa-user-shield"></i> <span data-i18n-key="settings-preferences">الخصوصية
                                    والتفضيلات</span>
                            </button>
                            <button type="button" class="st-nav-link danger" data-target="section-danger">
                                <i class="fas fa-exclamation-triangle"></i> <span
                                    data-i18n-key="settings-delete-account">إدارة الحساب</span>
                            </button>
                        </nav>
                    </aside>

                    <!-- منطقة محتوى النموذج -->
                    <div class="st-content-area">
                        <form id="settingsForm" class="settings-form">

                            <!-- 1. قسم معلومات الحساب -->
                            <div id="section-account" class="st-tab-content active">
                                <div class="settings-card">
                                    <div class="st-flex-header">
                                        <h2 class="settings-card-title" data-i18n-key="settings-account-info"
                                            style="border:none; margin:0; padding:0;">معلومات الحساب</h2>
                                    </div>

                                    <div class="form-group">
                                        <label for="email" class="form-label" data-i18n-key="settings-email">البريد
                                            الإلكتروني</label>
                                        <input type="email" id="email" class="form-control" disabled>
                                    </div>
                                    <div class="form-group">
                                        <label for="fullName" class="form-label" data-i18n-key="signup-fullname">الاسم
                                            الكامل</label>
                                        <input type="text" id="fullName" class="form-control" required disabled>
                                    </div>
                                    <div class="form-group">
                                        <label for="profileTitle" class="form-label"
                                            data-i18n-key="settings-profile-title-label">العنوان الوظيفي</label>
                                        <input type="text" id="profileTitle" class="form-control" disabled
                                            data-i18n-key="settings-profile-title-placeholder">
                                    </div>
                                    <div class="form-group">
                                        <label for="phone" class="form-label" data-i18n-key="signup-phone">رقم
                                            الهاتف</label>
                                        <div class="phone-input-wrapper" style="display: flex; gap: 10px;">
                                            <input type="tel" id="phone" class="form-control" disabled style="flex: 1;">
                                            <span id="phoneVerifiedBadge"
                                                style="display: none; align-items: center; color: #10b981;"><i
                                                    class="fas fa-check-circle fa-lg"></i></span>
                                            <button type="button" id="btnStartVerify" class="btn btn-outline"
                                                style="display: none; white-space: nowrap;"
                                                data-i18n-key="js-phone-verify-start">تأكيد الرقم</button>
                                        </div>
                                        <div id="otpSection"
                                            style="display: none; margin-top: 15px; padding: 15px; background: #f0f7ff; border-radius: 8px; border: 1px solid #cce3ff;">
                                            <p id="otpSentMessage" class="text-sm text-blue-800 mb-3"></p>
                                            <div style="display: flex; gap: 8px;">
                                                <input type="text" id="otpInput" class="form-control" placeholder="0000"
                                                    maxlength="4"
                                                    style="text-align: center; letter-spacing: 5px; font-weight: bold;">
                                                <button type="button" id="btnConfirmOTP" class="btn btn-primary"
                                                    data-i18n-key="verify-button">تأكيد</button>
                                            </div>
                                            <p class="text-xs text-gray-500 mt-2"
                                                data-i18n-key="js-phone-otp-demo-note">أدخل الرمز 0000 للتجربة حالياً
                                            </p>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="form-label" data-i18n-key="signup-location">الموقع</label>
                                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                                            <select id="country" class="form-select" disabled required>
                                                <option value="" data-i18n-key="settings-country-select">الدولة</option>
                                            </select>
                                            <select id="city" class="form-select" disabled required>
                                                <option value="" data-i18n-key="settings-city-select">المدينة</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label for="bio" class="form-label" data-i18n-key="signup-bio">نبذة عنك</label>
                                        <textarea id="bio" class="form-control" rows="3" disabled
                                            data-i18n-key="signup-bio-placeholder"></textarea>
                                    </div>
                                </div>
                            </div>

                            <!-- 2. قسم المهارات -->
                            <div id="section-skills" class="st-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-skills-title">المهارات</h2>
                                    <div id="skillsFormContainer"></div>
                                    <button type="button" id="addSkillBtn" class="btn btn-outline-dashed" disabled
                                        data-i18n-key="settings-add-skill-btn">+ إضافة مهارة</button>
                                </div>
                            </div>

                            <!-- 3. قسم الخبرة -->
                            <div id="section-experience" class="st-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-experience-title">الخبرة
                                        المهنية</h2>
                                    <div id="experienceFormContainer"></div>
                                    <button type="button" id="addExperienceBtn" class="btn btn-outline-dashed" disabled
                                        data-i18n-key="settings-add-experience-btn">+ إضافة خبرة</button>
                                </div>
                            </div>

                            <!-- 4. قسم التعليم -->
                            <div id="section-education" class="st-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-education-title">التعليم
                                    </h2>
                                    <div id="educationFormContainer"></div>
                                    <button type="button" id="addEducationBtn" class="btn btn-outline-dashed" disabled
                                        data-i18n-key="settings-add-education-btn">+ إضافة مؤهل</button>
                                </div>
                            </div>

                            <!-- 5. قسم الروابط الاجتماعية -->
                            <div id="section-social" class="st-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-social-links">الروابط
                                        الاجتماعية</h2>
                                    <div id="socialLinksContainer"></div>
                                    <button type="button" id="addSocialLinkBtn" class="btn btn-outline-dashed" disabled
                                        data-i18n-key="settings-add-social">+ إضافة رابط</button>
                                </div>
                            </div>

                            <!-- 6. قسم الخصوصية -->
                            <div id="section-privacy" class="st-tab-content">
                                <div class="settings-card">
                                    <h2 class="settings-card-title" data-i18n-key="settings-preferences">الخصوصية
                                        والتفضيلات</h2>
                                    <!-- <div class="form-group">
                                        <label class="form-label" data-i18n-key="settings-interests">مجالات
                                            الاهتمام</label>
                                        <div class="interests-container" id="interestsContainer"></div>
                                    </div> -->
                                    <div class="form-group-inline">
                                        <label data-i18n-key="settings-show-email">إظهار البريد للعموم</label>
                                        <label class="switch-toggle"><input type="checkbox" id="showEmailPublicly"
                                                disabled><span class="slider"></span></label>
                                    </div>
                                    <div class="form-group-inline">
                                        <label data-i18n-key="settings-show-phone">إظهار الهاتف للعموم</label>
                                        <label class="switch-toggle"><input type="checkbox" id="showPhonePublicly"
                                                disabled><span class="slider"></span></label>
                                    </div>
                                </div>
                            </div>

                            <!-- 7. قسم إدارة الحساب -->
                            <div id="section-danger" class="st-tab-content">
                                <div class="settings-card danger-zone">
                                    <h2 class="settings-card-title" data-i18n-key="settings-delete-account">حذف الحساب
                                    </h2>
                                    <p data-i18n-key="settings-delete-warning">بمجرد حذف حسابك، سيتم مسح جميع بياناتك
                                        ومشاريعك بشكل دائم ولا يمكن استرجاعها.</p>
                                    <button type="button" id="deleteAccountBtn" class="btn btn-danger"
                                        data-i18n-key="settings-delete-button">حذف حسابي نهائياً</button>
                                </div>
                            </div>

                            <!-- زر الحفظ النهائي -->
                            <div class="settings-actions" style="margin-top: 2rem;">
                                <button type="button" class="btn btn-outline" id="editBtnGlobal"
                                    data-i18n-key="settings-account-info-edit">تعديل</button>
                                <button type="submit" class="btn btn-primary" id="saveAllBtn"
                                    data-i18n-key="settings-save-changes">حفظ التغييرات</button>

                            </div>
                            <div class="settings-actions" style="margin-top: 2rem;">

                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </section>
        <footer class="footer"></footer>
    </div>

    <!-- القوالب (Templates) مع مفاتيح الترجمة -->
    <template id="skillTemplate">
        <div class="dynamic-form-row skill-row">
            <input type="text" class="form-control skill-name" data-i18n-key="settings-skill-name-placeholder"
                placeholder="اسم المهارة">
            <div class="skill-level-container"><input type="range" class="skill-level" min="0" max="100"><span
                    class="skill-level-value">80%</span></div>
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="experienceTemplate">
        <div class="dynamic-form-row">
            <input type="text" class="form-control exp-title" data-i18n-key="settings-experience-title-placeholder"
                placeholder="المنصب">
            <input type="text" class="form-control exp-company" data-i18n-key="settings-experience-company-placeholder"
                placeholder="الشركة">
            <input type="text" class="form-control exp-period" data-i18n-key="settings-experience-period-placeholder"
                placeholder="الفترة">
            <textarea class="form-control exp-description" data-i18n-key="settings-experience-desc-placeholder"
                placeholder="الوصف" rows="2"></textarea>
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="educationTemplate">
        <div class="dynamic-form-row">
            <input type="text" class="form-control edu-degree" data-i18n-key="settings-education-degree-placeholder"
                placeholder="الشهادة">
            <input type="text" class="form-control edu-institution"
                data-i18n-key="settings-education-institution-placeholder" placeholder="المؤسسة">
            <input type="text" class="form-control edu-details" data-i18n-key="settings-education-details-placeholder"
                placeholder="التفاصيل">
            <button type="button" class="btn-icon remove-row-btn">&times;</button>
        </div>
    </template>

    <template id="socialLinkTemplate">
        <div class="social-link-row">
            <select class="form-select social-platform">
                <option value="website">Website</option>
                <option value="linkedin">LinkedIn</option>
                <option value="github">GitHub</option>
                <option value="twitter">Twitter</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
            </select>
            <input type="text" class="form-control social-url" data-i18n-key="settings-social-url-placeholder"
                placeholder="الرابط">
            <button type="button" class="btn-icon remove-link-btn" aria-label="Remove link">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                    </path>
                    <line x1="10" y1="11" x2="10" y2="17"></line>
                    <line x1="14" y1="11" x2="14" y2="17"></line>
                </svg>
            </button>
        </div>
    </template>

    <script src="/js/header.js"></script>
    <script src="/js/script.js"></script>
    <script src="/js/translation.js"></script>
    <script src="/js/settings.js"></script>
</body>

</html>
